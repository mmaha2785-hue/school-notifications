  <script>
const ROLES = {
  owner: 'مالكة المنصة',
  admin: 'مسؤولة النظام',
  principal: 'مديرة المدرسة',
  deputy: 'وكيلة شؤون الطلبة',
  counselor: 'الموجهة الطلابية',
  teacher: 'معلمة',
  staff: 'إدارية / راصدة',
  evaluation: 'عضوة التقويم الذاتي'
};

const NAV_ITEMS = {
  home:['home','⌂','الرئيسية'],
  observe:['observe','＋','الرصد'],
  cases:['cases','◫','الحالات'],
  students:['students','◎','الطالبات'],
  tardy:['tardy','◷','الانضباط الصباحي'],
  impact:['impact','◈','التحليل وقياس الأثر'],
  reports:['reports','▤','التقارير'],
  settings:['settings','⚙','الإدارة والإعدادات'],
  support:['support','?','الدعم الفني']
};

// واجهة كل دور مستقلة: لا نكتفي بتغيير المسمى، بل تتغير القائمة والرئيسية والإجراءات.
const ROLE_UI = {
  owner:{pages:['home','settings','support'],observe:false},
  admin:{pages:['home','students','reports','settings','support'],observe:false},
  principal:{pages:['home','observe','cases','students','impact','reports'],observe:true},
  deputy:{pages:['home','observe','cases','students','tardy','reports'],observe:true},
  counselor:{pages:['home','observe','cases','students','impact','reports'],observe:true},
  teacher:{pages:['home','observe','cases','tardy'],observe:true},
  staff:{pages:['home','observe','tardy'],observe:true},
  evaluation:{pages:['home','impact','reports'],observe:false}
};
function roleConfig(){return ROLE_UI[state.role]||ROLE_UI.teacher;}
function canPage(id){return roleConfig().pages.includes(id);}
function canObserve(){return roleConfig().observe;}

const SCHOOL_SEED = window.SCHOOL_SEED_103 || {school:{id:'school-103',name:'الثانوية الثالثة بعد المئة - مسارات',stage:'الثانوية',academicYear:'1448هـ'},students:[]};
const ACTIVE_SCHOOL_ID = SCHOOL_SEED.school.id;
const SCHOOL_STORAGE_KEY = `school_monitoring_v2_${ACTIVE_SCHOOL_ID}`;

const defaultData = {
  school: SCHOOL_SEED.school,
  role:'counselor',
  students:SCHOOL_SEED.students,
  staffMembers:[],
  cases:[],
  gate:[],
  interventions:[],
  communications:[],
  supportTickets:[],
  audit:[],
  settings:{assembly:'06:45',period1:'07:00',period1End:'07:45',period2:'07:45',insideDelay:15,academicYear:'1448هـ'}
};

let state = loadState();
let currentPage = 'home';
let pageHistory = [];

function loadState(){
  const saved = localStorage.getItem(SCHOOL_STORAGE_KEY);
  if(!saved) return structuredClone(defaultData);
  const parsed=JSON.parse(saved);
  // بيانات الطالبات مصدرها ملف المدرسة الحالي، أما الحالات والمتابعات فتظل محفوظة لهذه المدرسة فقط.
  return {...defaultData, ...parsed, school:{...defaultData.school,...(parsed.school||{})}, students:Array.isArray(parsed.students)?parsed.students:defaultData.students, staffMembers:Array.isArray(parsed.staffMembers)?parsed.staffMembers:[], supportTickets:Array.isArray(parsed.supportTickets)?parsed.supportTickets:[], audit:Array.isArray(parsed.audit)?parsed.audit:[]};
}
function save(){localStorage.setItem(SCHOOL_STORAGE_KEY,JSON.stringify(state));}
function audit(action,note=''){const now=new Date();state.audit=state.audit||[];state.audit.unshift({id:`AUD-${Date.now()}`,action,note,by:ROLES[state.role],date:now.toISOString().slice(0,10),time:now.toTimeString().slice(0,5)});state.audit=state.audit.slice(0,200);save();}
function student(id){return state.students.find(s=>s.id===id)||{name:'—',grade:'—',section:'—'};}
function esc(v=''){return String(v).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}
function localDate(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`;}
function minutesDiff(a,b){if(!a||!b)return null;const [ah,am]=a.split(':').map(Number),[bh,bm]=b.split(':').map(Number);return bh*60+bm-(ah*60+am)}
function improvement(before,after){if(!before)return 0;return Math.round(((before-after)/before)*100);}
function normalizePhone(v=''){const d=String(v||'').replace(/\D/g,'');if(!d)return '';if(d.startsWith('966'))return '+'+d;if(d.startsWith('05'))return '+966'+d.slice(1);return d.startsWith('+')?d:'+'+d;}
function maskPhone(v=''){const p=normalizePhone(v);if(!p)return 'غير مسجل';return p.slice(0,5)+'••••'+p.slice(-3);}
function canContactGuardian(){return !['owner','evaluation'].includes(state.role);}
function communicationCount(studentId){return (state.communications||[]).filter(x=>x.studentId===studentId).length;}
function schoolGroupStats(){
  const combos=new Map();
  state.students.forEach(s=>{const g=s.grade||'غير محدد',sec=String(s.section||'').trim();if(!sec)return;const key=`${g}||${sec}`;combos.set(key,(combos.get(key)||0)+1);});
  const byGrade={};
  for(const key of combos.keys()){const [g]=key.split('||');byGrade[g]=(byGrade[g]||0)+1;}
  return {total:combos.size,byGrade,items:[...combos.entries()].map(([key,count])=>{const [grade,section]=key.split('||');return {grade,section,count};}).sort((a,b)=>a.grade.localeCompare(b.grade,'ar')||Number(a.section)-Number(b.section))};
}
function deletionImpact(scope){
  if(scope==='ops') return (state.cases||[]).length+(state.gate||[]).length+(state.interventions||[]).length+(state.communications||[]).length;
  if(scope==='students') return state.students.length;
  if(scope==='staff') return (state.staffMembers||[]).length;
  if(scope==='all') return state.students.length+(state.staffMembers||[]).length+(state.cases||[]).length+(state.gate||[]).length+(state.interventions||[]).length+(state.communications||[]).length;
  return 0;
}
function reviewImportStudents(arr){
  const existing=new Map(state.students.map(s=>[String(s.id||s.importKey||'').trim(),s]));
  let added=0,updated=0,duplicates=0,invalid=0;
  const seen=new Set();
  arr.forEach(x=>{const key=String(x.id||x.importKey||'').trim();if(!x.name){invalid++;return;}if(key&&seen.has(key)){duplicates++;return;}if(key)seen.add(key);if(key&&existing.has(key))updated++;else added++;});
  return {total:arr.length,added,updated,duplicates,invalid};
}

function init(){
  const params=new URLSearchParams(location.search);
  const reviewRole=params.get('reviewRole');
  const reviewPage=params.get('page');
  if(reviewRole&&ROLES[reviewRole]) state.role=reviewRole;
  if(reviewPage&&NAV_ITEMS[reviewPage]) currentPage=reviewPage;
  document.getElementById('schoolNameBadge').textContent=state.school.name;
  document.getElementById('schoolMetaBadge').textContent=`${state.students.length} طالبة • بيانات هذه المدرسة فقط`;
  const roleSelect=document.getElementById('roleSelect');
  roleSelect.innerHTML=Object.entries(ROLES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
  roleSelect.value=state.role;
  roleSelect.addEventListener('change',e=>{
    state.role=e.target.value;
    currentPage='home';
    pageHistory=[];
    save();
    applyRoleChrome();
    renderNav();
    render();
  });
  document.getElementById('quickObserveBtn').onclick=()=>openObservationModal();
  document.getElementById('backBtn').onclick=()=>goBack();
  document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
  applyRoleChrome();renderNav();render();
}
function applyRoleChrome(){
  const q=document.getElementById('quickObserveBtn');
  q.style.display=canObserve()?'inline-flex':'none';
  const meta=document.getElementById('schoolMetaBadge');
  meta.textContent=state.role==='owner'?'إدارة المنتج • المدارس معزولة البيانات':`${state.students.length} طالبة • بيانات هذه المدرسة فقط`;
}
function renderNav(){
  if(!canPage(currentPage)) currentPage='home';
  const items=roleConfig().pages.map(id=>NAV_ITEMS[id]);
  document.getElementById('nav').innerHTML=items.map(([id,ico,label])=>`<button class="nav-item ${currentPage===id?'active':''}" data-page="${id}"><span class="ico">${ico}</span>${label}</button>`).join('');
  document.querySelectorAll('.nav-item').forEach(b=>b.onclick=()=>{navigateTo(b.dataset.page);document.getElementById('sidebar').classList.remove('open');});
}

function navigateTo(page,{replace=false}={}){
  if(!NAV_ITEMS[page]||!canPage(page)) return;
  if(page===currentPage) return;
  if(!replace) pageHistory.push(currentPage);
  currentPage=page;
  renderNav();
  render();
}
function goBack(){
  let target=null;
  while(pageHistory.length&&!target){
    const candidate=pageHistory.pop();
    if(candidate&&candidate!==currentPage&&canPage(candidate)) target=candidate;
  }
  currentPage=target||'home';
  renderNav();
  render();
}
function updateBackButton(){
  const b=document.getElementById('backBtn');
  if(!b) return;
  b.classList.toggle('hidden',currentPage==='home');
}
function setHeader(title,subtitle){document.getElementById('pageTitle').textContent=title;document.getElementById('pageSubtitle').textContent=subtitle;}
function render(){
  if(!canPage(currentPage)) currentPage='home';
  const content=document.getElementById('content');
  const views={home,observe,cases,students,tardy,impact,reports,settings,support};
  content.innerHTML=views[currentPage]();
  updateBackButton();
  wirePageEvents();
}

function roleHomeText(){
  const map={owner:'نظرة عامة على المدارس والمنتج دون الدخول الافتراضي للتفاصيل الحساسة.',admin:'إدارة بيانات المدرسة والحسابات والإعدادات التشغيلية.',principal:'مؤشرات المدرسة والقرارات والحالات التي تحتاج اعتمادًا.',deputy:'المواظبة والإجراءات والحالات التي تحتاج متابعة إدارية.',counselor:'الحالات والإرشاد والمتابعات وقياس الأثر.',teacher:'طالبات فصولك والرصد السريع وما يلزمك الآن.',staff:'الرصد اليومي السريع عند البوابة أو الميدان.',evaluation:'الفجوات والمؤشرات والتدخلات وقياس الأثر.'};return map[state.role];
}
function roleMetricCard(label,value,hint,tone=''){
  return `<div class="card kpi ${tone}"><div class="label">${label}</div><div class="value">${value}</div><div class="hint">${hint}</div></div>`;
}
function roleAction(title,sub,go='',action=''){
  const attr=go?`data-go="${go}"`:`data-action="${action}"`;
  return `<button class="quick-action" ${attr}><strong>${title}</strong><span>${sub}</span></button>`;
}
function home(){
  setHeader('الرئيسية',roleHomeText());
  const open=state.cases.filter(c=>c.status!=='مغلق').length;
  const today=state.cases.filter(c=>c.date===localDate()).length;
  const waiting=state.gate.filter(g=>g.date===localDate()&&!g.classTime).length;
  const positive=state.cases.filter(c=>c.category==='إيجابي').length;
  const follow=state.cases.filter(c=>c.status==='متابعة').length;
  const action=state.cases.filter(c=>c.status==='إجراء').length;
  const contacts=(state.communications||[]).length;
  const groupStats=schoolGroupStats();
  const sections=groupStats.total;
  const guardianCoverage=state.students.length?Math.round(state.students.filter(s=>s.guardianPhone).length/state.students.length*100):0;
  let metrics='', main='', lower='';

  if(state.role==='owner'){
    metrics=[
      roleMetricCard('المدارس','1','مدرسة مرتبطة','purple'),
      roleMetricCard('حالة المنصة','تشغيلية','جاهزة للإدارة المدرسية'),
      roleMetricCard('عزل البيانات','مفعّل','كل مدرسة بمفتاح مستقل','green'),
      roleMetricCard('إدارة المدرسة','1','مسؤولة نظام مرتبطة','beige')
    ].join('');
    main=`<div class="grid two" style="margin-top:16px"><div class="card"><div class="section-head"><div><h3>إدارة المنتج</h3><p>بدون الدخول الافتراضي في تفاصيل الطالبات.</p></div></div><div class="quick-actions">${roleAction('إدارة المدارس','المدارس والعزل والتهيئة','settings')}${roleAction('مسؤولو الأنظمة','حساب مستقل لكل مدرسة','settings')}${roleAction('إصدارات المنصة','مرجع التغييرات والإصدارات','settings')}${roleAction('الدعم الفني','طلبات الدعم ومتابعتها','support')}</div></div><div class="card"><div class="section-head"><div><h3>حالة المنصة</h3><p>مؤشرات المنتج فقط</p></div></div><div class="notice purple">لا تظهر لمالكة المنصة بوابة التأخر أو الحالات اليومية أو أسماء الطالبات افتراضيًا. الوصول التشغيلي يحتاج دورًا مدرسيًا منفصلًا.</div></div></div>`;
    lower='';
  } else if(state.role==='admin'){
    metrics=[
      roleMetricCard('الطالبات',state.students.length,'في قاعدة بيانات المدرسة'),
      roleMetricCard('الشعب الفعلية',sections,Object.entries(groupStats.byGrade).map(([g,n])=>`${g}: ${n}`).join(' • '),'purple'),
      roleMetricCard('أرقام أولياء الأمور',guardianCoverage+'%','اكتمال بيانات التواصل','green'),
      roleMetricCard('الحالات التشغيلية',state.cases.length,'بيانات المدرسة فقط','beige')
    ].join('');
    main=`<div class="grid two" style="margin-top:16px"><div class="card"><div class="section-head"><div><h3>إدارة بيانات المدرسة</h3><p>البيانات والحسابات والإعدادات التشغيلية</p></div></div><div class="quick-actions">${roleAction('بيانات الطالبات','بحث ومراجعة السجل','students')}${roleAction('استيراد البيانات','CSV أو نسخة احتياطية مع مراجعة','','import')}${roleAction('الإعدادات والصلاحيات','الأدوار وأوقات اليوم','settings')}${roleAction('الدعم الفني','فتح طلب ومتابعته','support')}</div></div><div class="card"><div class="section-head"><div><h3>تنبيهات جودة البيانات</h3><p>ما يحتاج مراجعة إدارية</p></div></div><div class="notice">أرقام أولياء الأمور مكتملة بنسبة ${guardianCoverage}%. لا تظهر أدوات الرصد اليومية لمسؤولة النظام إلا إذا مُنحت دورًا تشغيليًا إضافيًا.</div></div></div>`;
  } else if(state.role==='principal'){

    main=`<div class="grid two" style="margin-top:16px"><div class="card"><div class="section-head"><div><h3>القرارات والأولويات</h3><p>ما يحتاج متابعة القيادة</p></div><button class="btn soft small" data-go="cases">عرض الحالات</button></div>${priorityList()}</div><div class="card"><div class="section-head"><div><h3>إجراءات المديرة</h3><p>مختصرة ومباشرة</p></div></div><div class="quick-actions">${roleAction('+ رصد جديد','عند الحاجة','','observe')}${roleAction('مؤشرات المدرسة','الفجوات وقياس الأثر','impact')}${roleAction('التقارير','للمراجعة والاعتماد','reports')}</div></div></div>`;
    lower=`<div class="card" style="margin-top:16px"><div class="section-head"><div><h3>اتجاه مؤشرات الانضباط</h3><p>ملخص قيادي</p></div></div>${gapBars()}</div>`;

    main=`<div class="grid two" style="margin-top:16px"><div class="card"><div class="section-head"><div><h3>المواظبة والحالات الإدارية</h3><p>الأولوية الآن</p></div></div>${priorityList()}</div><div class="card"><div class="section-head"><div><h3>إجراءات سريعة</h3><p>عمل الوكيلة اليومي</p></div></div><div class="quick-actions">${roleAction('بوابة التأخر','تسجيل ومراجعة الوصول','tardy')}${roleAction('الحالات','الإجراءات والمتابعة','cases')}${roleAction('+ رصد جديد','فردي أو جماعي','','observe')}</div></div></div>`;
  } else if(state.role==='counselor'){

    main=`<div class="grid two" style="margin-top:16px"><div class="card"><div class="section-head"><div><h3>الحالات والمتابعات</h3><p>ما يحتاج تدخلًا أو متابعة</p></div><button class="btn soft small" data-go="cases">عرض الكل</button></div>${priorityList()}</div><div class="card"><div class="section-head"><div><h3>عمل الموجهة</h3><p>من الحالة إلى الأثر</p></div></div><div class="quick-actions">${roleAction('+ رصد جديد','عند الحاجة','','observe')}${roleAction('الحالات','خطط ومتابعات','cases')}${roleAction('قياس الأثر','قبل / بعد / قرار','impact')}</div></div></div>`;
    lower=`<div class="card" style="margin-top:16px"><div class="section-head"><div><h3>اتجاه الفجوات</h3><p>للمساعدة في اختيار التدخلات</p></div></div>${gapBars()}</div>`;
  } else if(state.role==='teacher'){
    const myCases=state.cases.filter(c=>c.observer===ROLES.teacher).length;
    metrics=[roleMetricCard('رصدت اليوم',myCases,'من حساب المعلمة'),roleMetricCard('دخلن المدرسة ولم يصلن',waiting,'يحتاج تأكيد وصول','beige'),roleMetricCard('حالاتي',myCases,'مرتبطة برصد المعلمة','purple'),roleMetricCard('سلوك إيجابي',state.cases.filter(c=>c.observer===ROLES.teacher&&c.category==='إيجابي').length,'تم رصده من المعلمة','green')].join('');
    main=`<div class="grid two" style="margin-top:16px"><div class="card"><div class="section-head"><div><h3>ما يلزمك الآن</h3><p>بدون شاشات الإدارة والتحليل</p></div></div>${waiting?`<div class="notice warning">يوجد ${waiting} طالبة دخلت المدرسة ولم يثبت وصولها للفصل بعد.</div>`:`<div class="notice">لا توجد طالبات بانتظار تأكيد الوصول للفصل.</div>`}</div><div class="card"><div class="section-head"><div><h3>إجراءات المعلمة</h3><p>أقل عدد من الخطوات</p></div></div><div class="quick-actions">${roleAction('+ رصد جديد','سلوك / مواظبة / إيجابي','','observe')}${roleAction('تأكيد الوصول للفصل','للطالبات الداخلات للمدرسة','tardy')}${roleAction('حالاتي','ما رصدته أو أحيل إليك','cases')}</div></div></div>`;
  } else if(state.role==='staff'){
    metrics=[roleMetricCard('رصد اليوم',today,'سجل المدرسة اليوم'),roleMetricCard('دخلن من البوابة',state.gate.length,'وقت موثق'),roleMetricCard('بانتظار الوصول للفصل',waiting,'يظهر للمعلمة','beige'),roleMetricCard('رصد إيجابي',positive,'يمكن تسجيله أيضًا','green')].join('');
    main=`<div class="grid two" style="margin-top:16px"><div class="card"><div class="section-head"><div><h3>الرصد الميداني</h3><p>هذه هي مهام الإدارية/الراصدة فقط</p></div></div><div class="quick-actions">${roleAction('+ رصد جديد','سريع فردي أو جماعي','','observe')}${roleAction('بوابة التأخر','QR أو تحقق يدوي','tardy')}</div></div><div class="card"><div class="section-head"><div><h3>حالة البوابة</h3><p>ملخص فوري</p></div></div><div class="notice">تم توثيق ${state.gate.length} دخول، منها ${waiting} ما زالت بانتظار تأكيد الوصول للفصل.</div></div></div>`;

    main=`<div class="grid two" style="margin-top:16px"><div class="card"><div class="section-head"><div><h3>الفجوات والتحسين</h3><p>بيانات مجمعة بدون تفاصيل حساسة غير لازمة</p></div></div>${gapBars()}</div><div class="card"><div class="section-head"><div><h3>أدوات التقويم</h3><p>من الخط الأساسي إلى قياس الأثر</p></div></div><div class="quick-actions">${roleAction('التحليل وقياس الأثر','الفجوات والتدخلات','impact')}${roleAction('تقارير التقويم','شواهد وتحسن','reports')}</div></div></div>`;
  }

  return `<div class="hero"><div><h3>صباح الخير، ${ROLES[state.role]}</h3><p>${roleHomeText()}</p></div><div class="hero-chip">واجهة مخصصة حسب الصلاحية</div></div><div class="grid kpis">${metrics}</div>${main}${lower}`;

function priorityList(){
  const awaiting=state.gate.filter(g=>!g.classTime).length;
  const follow=state.cases.filter(c=>c.status==='متابعة').length;
  const action=state.cases.filter(c=>c.status==='إجراء').length;
  const items=[
    ['حالات تحتاج إجراء',`${action} حالة`,'blue'],
    ['حالات قيد المتابعة',`${follow} حالة`,'purple'],
    ['طالبات دخلن المدرسة ولم يصلن الفصل',`${awaiting} طالبة`,'beige']
  ];
  return items.map(([a,b,c])=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border)"><strong style="font-size:13px">${a}</strong><span class="badge ${c}">${b}</span></div>`).join('');
}
function gapBars(){
  const counts={};
  state.cases.forEach(c=>{counts[c.kind]=(counts[c.kind]||0)+1;});
  const data=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,5);
  if(!data.length) return `<div class="notice">لا توجد بيانات رصد كافية بعد. ستظهر الفجوات تلقائيًا مع بدء الاستخدام.</div>`;
  const max=Math.max(...data.map(x=>x[1]),1);
  return data.map(([n,v])=>`<div class="bar-row"><span style="font-size:12px">${esc(n)}</span><div class="progress"><span style="width:${Math.round(v/max*100)}%"></span></div><strong>${v}</strong></div>`).join('');
}

function observe(){
  setHeader('الرصد','رصد سريع فردي أو جماعي في أقل عدد من الخطوات');
  return `<div class="card"><div class="section-head"><div><h3>اختر نوع الرصد</h3><p>لا تبدأ بنموذج طويل؛ اختر النوع ثم الطالبات.</p></div></div><div class="quick-actions"><button class="quick-action" data-observe-kind="سلوك"><strong>مخالفة / مشكلة سلوكية</strong><span>تصنيف + إجراء حسب الحاجة</span></button><button class="quick-action" data-observe-kind="مواظبة"><strong>مواظبة / غياب / تأخر</strong><span>وقت وتحقق موثّق</span></button><button class="quick-action" data-observe-kind="إيجابي"><strong>سلوك إيجابي أو متميز</strong><span>تعزيز وتوثيق تلقائي</span></button></div></div>
  <div class="card" style="margin-top:16px"><div class="section-head"><div><h3>آخر عمليات الرصد</h3><p>الأحدث أولًا</p></div></div>${casesTable(state.cases.slice().reverse().slice(0,6))}</div>`;
}

function visibleCases(){
  if(state.role==='teacher') return state.cases.filter(c=>c.observer===ROLES.teacher||c.owner===ROLES.teacher);
  return state.cases;
}
function cases(){
  const teacherMode=state.role==='teacher';
  setHeader(teacherMode?'حالاتي':'الحالات',teacherMode?'الحالات التي رصدتها المعلمة أو أُحيلت إليها فقط':'الحالات ضمن صلاحية هذا الدور');
  const list=visibleCases();
  return `<div class="card"><div class="toolbar no-print"><input id="caseSearch" placeholder="ابحثي باسم الطالبة أو نوع الحالة"><select class="select" id="caseFilter"><option value="all">كل الحالات</option><option>سلوك</option><option>مواظبة</option><option>إيجابي</option></select><span class="spacer"></span>${canObserve()?'<button class="btn primary" data-action="observe">+ رصد جديد</button>':''}</div><div style="height:12px"></div>${teacherMode&&list.length===0?'<div class="notice">لا توجد حالات مرتبطة بحساب المعلمة حتى الآن.</div><div style="height:12px"></div>':''}<div id="casesContainer">${casesTable(list)}</div></div>`;
}
function casesTable(list){
  return `<div class="table-wrap"><table class="table"><thead><tr><th>رقم</th><th>الطالبة</th><th>النوع</th><th>التاريخ/الوقت</th><th>الحالة</th><th>المسؤولة الحالية</th><th></th></tr></thead><tbody>${list.map(c=>{const s=student(c.studentId);return `<tr><td>${c.id}</td><td><strong>${esc(s.name)}</strong><br><small>${esc(s.section)}</small></td><td>${esc(c.kind)}<br><span class="badge ${c.category==='إيجابي'?'green':c.category==='مواظبة'?'beige':'purple'}">${esc(c.category)}</span></td><td>${c.date}<br>${c.time}</td><td><span class="badge ${c.status==='مغلق'?'green':c.status==='متابعة'?'blue':'purple'}">${c.status}</span></td><td>${esc(c.owner)}</td><td><button class="btn soft small" data-case="${c.id}">فتح</button></td></tr>`}).join('')}</tbody></table></div>`;
}

function students(){
  setHeader('الطالبات','السجل الموحد للطالبة: الرصد، المواظبة، الإيجابيات، والإجراءات');
  return `<div class="card"><div class="toolbar"><input id="studentSearch" placeholder="بحث بالاسم أو الشعبة"><span class="spacer"></span><button class="btn secondary small" data-action="import">استيراد Excel</button></div><div style="height:12px"></div><div class="table-wrap"><table class="table"><thead><tr><th>الطالبة</th><th>الصف</th><th>الشعبة</th><th>الحالات</th><th>ولي الأمر</th><th>QR داخلي</th><th></th></tr></thead><tbody id="studentsBody">${state.students.map(s=>`<tr><td><strong>${esc(s.name)}</strong></td><td>${s.grade}</td><td>${s.section}</td><td>${state.cases.filter(c=>c.studentId===s.id).length}</td><td>${s.guardianPhone?`<bdi class="phone-ltr" dir="ltr" title="${esc(normalizePhone(s.guardianPhone))}">${maskPhone(s.guardianPhone)}</bdi>`:'<span class="badge beige">غير مسجل</span>'}</td><td><code>${s.qr}</code></td><td><button class="btn soft small" data-student="${s.id}">الملف</button></td></tr>`).join('')}</tbody></table></div></div>`;
}

function tardy(){
  setHeader('الانضباط الصباحي','توثيق وقت البوابة وربطه بوصول الطالبة إلى الفصل');
  const rows=state.gate.filter(g=>g.date===localDate());
  return `<div class="grid two">
    <div class="card"><div class="section-head"><div><h3>تسجيل عند البوابة</h3><p>الاسم لا يُكتب يدويًا إذا كانت الطالبة موجودة في قاعدة البيانات.</p></div><span class="badge teal">QR / تحقق يدوي</span></div>
      <div class="form-grid"><div class="field"><label>رمز QR أو المعرف</label><input id="gateQr" placeholder="مثال Q-8K2M1"></div><div class="field"><label>أو اختاري الطالبة</label><select id="gateStudent" class="select"><option value="">— اختيار —</option>${state.students.map(s=>`<option value="${s.id}">${s.name} — ${s.section}</option>`).join('')}</select></div></div>
      <div style="margin-top:12px"><button class="btn primary" id="registerGate">تسجيل الدخول الآن</button></div>
      <div class="notice" style="margin-top:14px">يسجل النظام الوقت تلقائيًا ويظهر فورًا لمعلمة الشعبة أن الطالبة دخلت المدرسة ولم تصل الفصل بعد.</div>
    </div>
    <div class="card"><div class="section-head"><div><h3>إعدادات اليوم الدراسي</h3><p>تستخدم للتصنيف الآلي للتأخر.</p></div></div>
      <div class="form-grid"><div class="field"><label>بدء الطابور</label><input type="time" id="assembly" value="${state.settings.assembly}"></div><div class="field"><label>بدء الحصة الأولى</label><input type="time" id="period1" value="${state.settings.period1}"></div><div class="field"><label>نهاية الحصة الأولى</label><input type="time" id="period1End" value="${state.settings.period1End}"></div><div class="field"><label>حد التأخر داخل المدرسة (دقيقة)</label><input type="number" id="insideDelay" value="${state.settings.insideDelay}"></div></div>
      <button class="btn secondary small" id="saveTimes" style="margin-top:12px">حفظ الإعدادات</button>
    </div>
  </div>
  <div class="card" style="margin-top:16px"><div class="section-head"><div><h3>وصلن المدرسة اليوم</h3><p>المعلمة تؤكد الوصول للفصل بضغطة واحدة.</p></div><span class="badge beige">${rows.filter(r=>!r.classTime).length} بانتظار الوصول للفصل</span></div>
    <div class="table-wrap"><table class="table"><thead><tr><th>الطالبة</th><th>الشعبة</th><th>وقت البوابة</th><th>طريقة التحقق</th><th>وقت الفصل</th><th>الفرق</th><th></th></tr></thead><tbody>${rows.map(g=>{const s=student(g.studentId);const d=minutesDiff(g.gateTime,g.classTime);return `<tr><td><strong>${s.name}</strong></td><td>${s.section}</td><td>${g.gateTime}</td><td><span class="badge ${g.method==='QR'?'teal':'beige'}">${g.method}</span></td><td>${g.classTime||'<span class="badge red">لم تصل</span>'}</td><td>${d==null?'—':`${d} د`}</td><td>${g.classTime?'':`<button class="btn success small" data-class-arrival="${g.studentId}">وصلت للفصل</button>`}</td></tr>`}).join('')}</tbody></table></div>
  </div>`;
}

function impact(){
  setHeader('التحليل وقياس الأثر','من البيانات إلى فجوة ثم تدخل ثم قياس قبل/بعد وقرار تحسيني');
  const open=state.cases.filter(c=>c.status!=='مغلق').length;
  const closed=state.cases.filter(c=>c.status==='مغلق').length;
  const positive=state.cases.filter(c=>c.category==='إيجابي').length;
  const total=state.cases.length;
  return `<div class="grid kpis"><div class="card kpi purple"><div class="label">إجمالي الرصد</div><div class="value">${total}</div><div class="hint">من بيانات المدرسة الحالية</div></div><div class="card kpi"><div class="label">حالات مفتوحة</div><div class="value">${open}</div><div class="hint">تحتاج إجراء أو متابعة</div></div><div class="card kpi green"><div class="label">حالات مغلقة</div><div class="value">${closed}</div><div class="hint">بعد استكمال المسار</div></div><div class="card kpi beige"><div class="label">سلوك إيجابي</div><div class="value">${positive}</div><div class="hint">تعزيز وتميز</div></div></div>
  <div class="grid two" style="margin-top:16px"><div class="card"><div class="section-head"><div><h3>الفجوات ذات الأولوية</h3><p>تظهر من الرصد الحقيقي، ولا تُعتمد تلقائيًا.</p></div><button class="btn purple small" data-action="new-gap">+ بطاقة فجوة</button></div>${gapBars()}</div><div class="card"><div class="section-head"><div><h3>التدخلات وقياس الأثر</h3><p>قبل/بعد مع قرار تحسيني.</p></div></div>${state.interventions.length?state.interventions.map(i=>`<div style="padding:12px 0;border-bottom:1px solid var(--border)"><div class="metric-split"><div><strong style="font-size:15px">${i.gap}</strong><br><span>${i.start} → ${i.end}</span></div><span class="badge ${improvement(i.baseline,i.after)>=i.target?'green':'beige'}">تحسن ${improvement(i.baseline,i.after)}%</span></div><div class="progress" style="margin-top:10px"><span style="width:${Math.min(100,improvement(i.baseline,i.after))}%"></span></div></div>`).join(''):`<div class="notice">لم تُنشأ تدخلات بعد. بعد ظهور فجوة حقيقية يمكن إنشاء تدخل وربطه بخط أساس وقياس أثر.</div>`}</div></div>`;
}

function reports(){
  setHeader('التقارير','تقارير رسمية RTL قابلة للطباعة والتنزيل والمشاركة');
  const cards=[['تقرير حالة فردية','سجل الحالة والإجراءات والمتابعة والتوقيعات'],['تقرير الانضباط الصباحي','التأخر حسب الوقت والشعبة والتكرار'],['تقرير السلوك والمخالفات','توزيع المخالفات والفجوات'],['تقرير السلوك الإيجابي','الرصد المتميز والتعزيز'],['تقرير قياس الأثر','خط أساس + تدخل + بعدي + قرار'],['تقرير التقويم الذاتي','مؤشرات مجمعة وشواهد التحسين']];
  return `<div class="grid three">${cards.map(([a,b],i)=>`<div class="card"><h3>${a}</h3><p class="card-subtitle">${b}</p><div class="toolbar"><button class="btn soft small" data-report="${i}">معاينة</button><button class="btn secondary small" onclick="window.print()">طباعة</button></div></div>`).join('')}</div><div class="notice" style="margin-top:16px">قائمة المشاركة النهائية مصممة لتشمل: تنزيل PDF، طباعة، مشاركة، وحفظ إلى Google Drive عند ربط الحساب وباختيار المستخدم. النسخة الحالية تنفذ المعاينة والطباعة محليًا، والربط السحابي يحتاج Backend/Auth.</div>`;
}

function settings(){
  if(state.role==='owner'){

function support(){
  setHeader('الدعم الفني','تسجيل المشكلة ومتابعة الطلبات دون كشف بيانات حساسة تلقائيًا');
  const tickets=(state.supportTickets||[]).slice().reverse();
  const rows=tickets.length?tickets.map(t=>`<tr><td><strong>${esc(t.id)}</strong></td><td>${esc(t.category)}</td><td>${esc(t.priority)}</td><td><span class="badge ${t.status==='تم الحل'?'green':t.status==='قيد المتابعة'?'blue':t.status==='مغلق'?'beige':'purple'}">${esc(t.status)}</span></td><td>${esc(t.date)} ${esc(t.time)}</td><td>${esc(t.by)}</td><td>${state.role==='owner'||state.role==='admin'?`<select class="select support-status" data-ticket-status="${esc(t.id)}"><option ${t.status==='جديد'?'selected':''}>جديد</option><option ${t.status==='قيد المتابعة'?'selected':''}>قيد المتابعة</option><option ${t.status==='تم الحل'?'selected':''}>تم الحل</option><option ${t.status==='مغلق'?'selected':''}>مغلق</option></select>`:''}</td></tr>`).join(''):'<tr><td colspan="7"><div class="empty">لا توجد طلبات دعم حتى الآن.</div></td></tr>';
  return `<div class="grid two"><div class="card"><div class="section-head"><div><h3>طلب دعم جديد</h3><p>اكتبي المشكلة باختصار، ويمكن تعديل الطلب قبل الحفظ</p></div></div><div class="form-grid"><div class="field"><label>نوع المشكلة</label><select id="supportCategory" class="select"><option>الدخول والحسابات</option><option>البيانات والاستيراد</option><option>الصلاحيات</option><option>التقارير والطباعة</option><option>الرصد والحالات</option><option>أخرى</option></select></div><div class="field"><label>الأولوية</label><select id="supportPriority" class="select"><option>عادية</option><option>مرتفعة</option><option>عاجلة</option></select></div><div class="field full"><label>وصف المشكلة</label><textarea id="supportDescription" rows="5" placeholder="ما الذي حدث؟ وما الخطوة التي كنتِ تقومين بها؟"></textarea></div><div class="field full"><label>وسيلة تواصل اختيارية</label><input id="supportContact" placeholder="بريد أو رقم داخلي — اختياري"></div></div><button class="btn primary" id="submitSupport" style="margin-top:12px">حفظ طلب الدعم</button></div><div class="card"><div class="section-head"><div><h3>معلومات ستُرفق بالطلب</h3><p>لتسهيل الدعم دون إعادة الشرح</p></div></div><div class="notice"><strong>المدرسة:</strong> ${esc(state.school.name)}<br><strong>الدور:</strong> ${esc(ROLES[state.role])}<br><strong>معرف المدرسة:</strong> ${esc(state.school.id)}<br><strong>لا تُرفق أسماء الطالبات أو أرقام أولياء الأمور تلقائيًا.</strong></div></div></div><div class="card" style="margin-top:16px"><div class="section-head"><div><h3>سجل طلبات الدعم</h3><p>رقم طلب + حالة متابعة واضحة</p></div></div><div class="table-wrap"><table><thead><tr><th>الطلب</th><th>النوع</th><th>الأولوية</th><th>الحالة</th><th>التاريخ</th><th>بواسطة</th><th>تحديث الحالة</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;

function wirePageEvents(){
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>navigateTo(b.dataset.go));
  document.querySelectorAll('[data-action="observe"]').forEach(b=>b.onclick=()=>openObservationModal());
  document.querySelectorAll('[data-observe-kind]').forEach(b=>b.onclick=()=>openObservationModal(b.dataset.observeKind));
  document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>openCase(b.dataset.case));
  document.querySelectorAll('[data-student]').forEach(b=>b.onclick=()=>openStudent(b.dataset.student));
  document.querySelectorAll('[data-class-arrival]').forEach(b=>b.onclick=()=>markClassArrival(b.dataset.classArrival));
  document.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>openReport(Number(b.dataset.report)));
  const caseSearch=document.getElementById('caseSearch'),caseFilter=document.getElementById('caseFilter');
  if(caseSearch){const update=()=>{let list=visibleCases().slice();const q=caseSearch.value.trim();const f=caseFilter.value;if(q)list=list.filter(c=>student(c.studentId).name.includes(q)||c.kind.includes(q)||c.id.includes(q));if(f!=='all')list=list.filter(c=>c.category===f);document.getElementById('casesContainer').innerHTML=casesTable(list);document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>openCase(b.dataset.case));};caseSearch.oninput=update;caseFilter.onchange=update;}
  const studentSearch=document.getElementById('studentSearch');if(studentSearch)studentSearch.oninput=()=>{const q=studentSearch.value.trim();document.getElementById('studentsBody').innerHTML=state.students.filter(s=>s.name.includes(q)||s.section.includes(q)).map(s=>`<tr><td><strong>${esc(s.name)}</strong></td><td>${s.grade}</td><td>${s.section}</td><td>${state.cases.filter(c=>c.studentId===s.id).length}</td><td><code>${s.qr}</code></td><td><button class="btn soft small" data-student="${s.id}">الملف</button></td></tr>`).join('');document.querySelectorAll('[data-student]').forEach(b=>b.onclick=()=>openStudent(b.dataset.student));};
  const rg=document.getElementById('registerGate');if(rg)rg.onclick=registerGate;
  const st=document.getElementById('saveTimes');if(st)st.onclick=saveTimes;
  document.querySelectorAll('[data-action="import"]').forEach(b=>b.onclick=()=>openImportModal());
  document.querySelectorAll('[data-action="backup"]').forEach(b=>b.onclick=()=>downloadBackup());
  document.querySelectorAll('[data-action="export-students"]').forEach(b=>b.onclick=()=>exportStudentsCsv());
  document.querySelectorAll('[data-action="delete-data"]').forEach(b=>b.onclick=()=>openDeleteDataModal());
  document.querySelectorAll('[data-action="manage-staff"]').forEach(b=>b.onclick=()=>openStaffManager());
  document.querySelectorAll('[data-action="manage-groups"]').forEach(b=>b.onclick=()=>openGroupsManager());
  document.querySelectorAll('[data-action="data-transfer"]').forEach(b=>b.onclick=()=>openDataTransfer());
  document.querySelectorAll('[data-ticket-status]').forEach(sel=>sel.onchange=()=>updateSupportStatus(sel.dataset.ticketStatus,sel.value));
  const auditSearch=document.getElementById('auditSearch');if(auditSearch)auditSearch.oninput=()=>{const q=auditSearch.value.trim().toLowerCase();document.querySelectorAll('#auditTimeline [data-audit-text]').forEach(x=>x.style.display=!q||x.dataset.auditText.includes(q)?'block':'none');};
  const saveSchool=document.getElementById('saveSchoolData');if(saveSchool)saveSchool.onclick=saveSchoolData;
  const submitSupport=document.getElementById('submitSupport');if(submitSupport)submitSupport.onclick=submitSupportTicket;
  document.querySelectorAll('[data-action="new-gap"]').forEach(b=>b.onclick=()=>openGapModal());
}

function openModal(html){const bd=document.getElementById('modalBackdrop');document.getElementById('modal').innerHTML=html;bd.classList.remove('hidden');}
function closeModal(){document.getElementById('modalBackdrop').classList.add('hidden');}
document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal();});

function openObservationModal(preKind=''){
  if(!canObserve()){toast('هذا الدور لا يملك صلاحية الرصد في الواجهة الحالية');return;}
  openModal(`<div class="modal-header"><h3>رصد جديد</h3><button class="btn icon secondary" id="closeModal">✕</button></div><div class="modal-body"><div class="option-cards" id="obsKinds">${['سلوك','مواظبة','إيجابي'].map(k=>`<button class="option-card ${preKind===k?'selected':''}" data-k="${k}">${k==='سلوك'?'مخالفة / مشكلة سلوكية':k==='مواظبة'?'مواظبة / تأخر / غياب':'سلوك إيجابي / متميز'}</button>`).join('')}</div><div style="height:16px"></div><div class="form-grid"><div class="field"><label>الطالبة</label><select class="select" id="obsStudent"><option value="">— اختيار —</option>${state.students.map(s=>`<option value="${s.id}">${s.name} — ${s.section}</option>`).join('')}</select></div><div class="field"><label>نوع الرصد</label><input id="obsType" placeholder="مثال: تأخر صباحي"></div><div class="field"><label>المكان</label><select id="obsPlace" class="select"><option>الفصل</option><option>البوابة الرئيسية</option><option>الساحة</option><option>الممر</option><option>المعمل</option><option>أخرى</option></select></div><div class="field"><label>نمط الرصد</label><select id="obsMode" class="select"><option>فردي</option><option>جماعي</option></select></div><div class="field full"><label>وصف مختصر (عند الحاجة)</label><textarea id="obsNotes" rows="3" placeholder="لا تكرري معلومات موجودة بالفعل"></textarea></div></div><div class="notice" style="margin-top:14px">التاريخ والوقت واسم الراصدة تحفظ تلقائيًا. الاقتراحات التربوية قابلة للتعديل؛ الإجراءات النظامية الثابتة تظهر كمطلوبة.</div></div><div class="modal-footer"><button class="btn primary" id="saveObservation">حفظ الرصد</button><button class="btn secondary" id="cancelObservation">إلغاء</button></div>`);
  let selected=preKind;
  document.getElementById('closeModal').onclick=closeModal;document.getElementById('cancelObservation').onclick=closeModal;
  document.querySelectorAll('#obsKinds [data-k]').forEach(b=>b.onclick=()=>{selected=b.dataset.k;document.querySelectorAll('#obsKinds .option-card').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');});
  document.getElementById('saveObservation').onclick=()=>{const sid=document.getElementById('obsStudent').value;const type=document.getElementById('obsType').value.trim();if(!selected||!sid||!type){toast('اختاري نوع الرصد والطالبة واكتبي النوع');return;}const now=new Date();const id=`C-${1043+state.cases.length}`;state.cases.push({id,schoolId:state.school.id,studentId:sid,kind:type,category:selected,status:selected==='إيجابي'?'مغلق':'إجراء',date:now.toISOString().slice(0,10),time:now.toTimeString().slice(0,5),place:document.getElementById('obsPlace').value,observer:ROLES[state.role],owner:selected==='إيجابي'?'—':'الموجهة الطلابية',notes:document.getElementById('obsNotes').value,impact:selected==='إيجابي'?'positive':'pending'});save();closeModal();toast('تم حفظ الرصد');render();};
}

function openCase(id){
  const c=state.cases.find(x=>x.id===id),s=student(c.studentId);
  const suggestion=c.category==='إيجابي'?'تعزيز السلوك وتوثيقه':c.category==='مواظبة'?'اقتراح: التواصل مع ولي الأمر عند التكرار أو الحاجة':'اقتراح: إشعار ولي الأمر إذا كانت الحالة تستدعي ذلك';
  openModal(`<div class="modal-header"><div><h3>${c.id} — ${s.name}</h3><div style="margin-top:6px"><span class="badge ${c.category==='مواظبة'?'beige':c.category==='إيجابي'?'green':'purple'}">${c.category}</span> <span class="badge blue">${c.status}</span></div></div><button class="btn icon secondary" id="closeCase">✕</button></div>
  <div class="modal-body">
    <div class="grid two">
      <div class="card" style="box-shadow:none"><h3>بيانات الحالة</h3><p><strong>النوع:</strong> ${c.kind}</p><p><strong>المكان:</strong> ${c.place}</p><p><strong>وقت الرصد:</strong> ${c.date} — ${c.time}</p><p><strong>الراصدة:</strong> ${c.observer}</p><p><strong>الملاحظة:</strong> ${c.notes||'—'}</p></div>
      <div class="card" style="box-shadow:none"><h3>الخطوة الحالية</h3><p><strong>المسؤولة:</strong> ${c.owner}</p><div class="notice">${suggestion}. هذا اقتراح قابل للتنفيذ أو التعديل أو التجاوز، ولا يتم أي إرسال تلقائي.</div>${canContactGuardian()?`<div class="toolbar" style="margin-top:10px"><button class="btn primary small" id="caseContact">تواصل مع ولي الأمر</button><button class="btn secondary small" id="caseSkipContact">تجاوز الاقتراح</button></div>`:''}</div>
    </div>
    <hr class="sep"><h3>السجل الزمني</h3>
    <div class="timeline">
      <div class="timeline-item"><strong>تم الرصد</strong><p>${c.observer} • ${c.date} ${c.time}</p></div>
      <div class="timeline-item"><strong>تم تحويل الحالة</strong><p>${c.owner} • تلقائي حسب النوع والصلاحية</p></div>
      ${(state.communications||[]).filter(x=>x.caseId===c.id).map(x=>`<div class="timeline-item"><strong>${esc(x.action)}</strong><p>${esc(x.by)} • ${esc(x.date)} ${esc(x.time)}${x.note?` • ${esc(x.note)}`:''}</p></div>`).join('')}
      <div class="timeline-item"><strong>متابعة / قياس أثر</strong><p>تظهر عند تنفيذ الإجراء وتحديد موعد القياس</p></div>
    </div>
  </div>
  <div class="modal-footer"><button class="btn purple" id="caseFollow">إضافة متابعة</button><button class="btn secondary" onclick="window.print()">طباعة</button></div>`);
  document.getElementById('closeCase').onclick=closeModal;
  document.getElementById('caseFollow').onclick=()=>{c.status='متابعة';save();closeModal();toast('تم تحديث الحالة إلى متابعة');render();};
  const contact=document.getElementById('caseContact'); if(contact) contact.onclick=()=>openGuardianContact(s.id,c.id);
  const skip=document.getElementById('caseSkipContact'); if(skip) skip.onclick=()=>{logCommunication(s.id,c.id,'تم تجاوز اقتراح التواصل','لم يُنفذ التواصل؛ قرار المستخدم');closeModal();toast('تم توثيق تجاوز الاقتراح');render();};
}

  <div class="modal-body">
    <div class="grid three">

      <div class="card kpi green" style="box-shadow:none"><div class="label">إيجابي</div><div class="value">${cs.filter(c=>c.category==='إيجابي').length}</div></div>
      <div class="card kpi beige" style="box-shadow:none"><div class="label">مواظبة</div><div class="value">${cs.filter(c=>c.category==='مواظبة').length}</div></div>

      <div class="toolbar"><strong>${s.guardianPhone?`<bdi class="phone-ltr" dir="ltr">${esc(normalizePhone(s.guardianPhone))}</bdi>`:'لا يوجد رقم مسجل'}</strong><span class="spacer"></span>${canContactGuardian()&&s.guardianPhone?`<button class="btn primary small" id="studentContact">تواصل</button>`:''}</div>
      ${comms.length?`<div class="timeline" style="margin-top:12px">${comms.slice(0,5).map(x=>`<div class="timeline-item"><strong>${esc(x.action)}</strong><p>${esc(x.by)} • ${esc(x.date)} ${esc(x.time)}${x.note?` • ${esc(x.note)}`:''}</p></div>`).join('')}</div>`:''}
    </div>
    <div style="margin-top:14px">${casesTable(cs)}</div>
  </div>`);

function logCommunication(studentId,caseId,action,note=''){

function parseCsv(text){
  const lines=text.replace(/^\ufeff/,'').split(/\r?\n/).filter(x=>x.trim());if(lines.length<2)return [];
  const split=line=>{const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(q&&line[i+1]==='"'){cur+='"';i++;}else q=!q;}else if(ch===','&&!q){out.push(cur);cur='';}else cur+=ch;}out.push(cur);return out.map(x=>x.trim());};
  const h=split(lines[0]).map(x=>x.toLowerCase().replace(/\s+/g,''));
  const idx=(...names)=>{for(const n of names){const i=h.indexOf(n.toLowerCase().replace(/\s+/g,''));if(i>=0)return i;}return -1;};
  const ni=idx('name','الاسم','اسمالطالبة','الطالبة'),gi=idx('grade','الصف','المرحلة'),si=idx('section','الشعبة','الفصل'),pi=idx('guardianphone','رقمولىالامر','رقموليالأمر','الجوال','رقمالجوال'),idi=idx('id','المعرف','رقمالطالبة'),qi=idx('qr','رمزqr');
  return lines.slice(1).map((line,n)=>{const a=split(line);const name=ni>=0?a[ni]:a[0];if(!name)return null;const id=idi>=0&&a[idi]?a[idi]:`IMP-${Date.now()}-${n}`;return {id,name,grade:gi>=0?a[gi]:'',section:si>=0?a[si]:'',guardianPhone:pi>=0?a[pi]:'',qr:qi>=0&&a[qi]?a[qi]:`Q${state.school.id.replace(/\D/g,'')||'S'}-${Math.random().toString(16).slice(2,10).toUpperCase()}`,schoolId:state.school.id};}).filter(Boolean);
}

function openStaffManager(){
  const rows=(state.staffMembers||[]).map(m=>`<tr><td><strong>${esc(m.name)}</strong></td><td>${esc(m.role)}</td><td>${esc(m.email||'—')}</td><td>${esc(m.status||'نشطة')}</td><td><button class="btn soft small" data-remove-staff="${esc(m.id)}">حذف</button></td></tr>`).join('')||'<tr><td colspan="5"><div class="empty">لا توجد منسوبات مضافة بعد. أضيفي فقط بيانات منسوبات المدرسة الفعلية.</div></td></tr>';
  openModal(`<div class="modal-header"><div><h3>بيانات المنسوبات</h3><p class="muted">لا توجد أسماء افتراضية؛ أضيفي بيانات مدرستك فقط.</p></div><button class="btn icon secondary" id="closeStaff">✕</button></div><div class="modal-body"><div class="table-wrap"><table><thead><tr><th>الاسم</th><th>الدور</th><th>البريد</th><th>الحالة</th><th></th></tr></thead><tbody>${rows}</tbody></table></div><hr class="sep"><h3>إضافة منسوبة</h3><div class="form-grid"><div class="field"><label>الاسم</label><input id="staffName"></div><div class="field"><label>الدور</label><select id="staffRole" class="select">${Object.entries(ROLES).filter(([k])=>!['owner'].includes(k)).map(([k,v])=>`<option>${v}</option>`).join('')}</select></div><div class="field full"><label>البريد / معرف الدخول</label><input id="staffEmail" placeholder="أدخليه من بيانات المدرسة"></div></div></div><div class="modal-footer"><button class="btn primary" id="addStaff">إضافة</button><button class="btn secondary" id="closeStaff2">إغلاق</button></div>`);
  document.getElementById('closeStaff').onclick=closeModal;document.getElementById('closeStaff2').onclick=closeModal;
  document.getElementById('addStaff').onclick=()=>{const name=document.getElementById('staffName').value.trim();if(!name){toast('أدخلي اسم المنسوبة');return;}const m={id:`STF-${Date.now()}`,schoolId:state.school.id,name,role:document.getElementById('staffRole').value,email:document.getElementById('staffEmail').value.trim(),status:'نشطة'};state.staffMembers=state.staffMembers||[];state.staffMembers.push(m);audit('إضافة منسوبة',`${m.name} • ${m.role}`);save();closeModal();toast('تمت إضافة المنسوبة');render();};
  document.querySelectorAll('[data-remove-staff]').forEach(b=>b.onclick=()=>{const m=state.staffMembers.find(x=>x.id===b.dataset.removeStaff);if(!m)return;if(!confirm(`حذف ${m.name} من قائمة المنسوبات؟`))return;state.staffMembers=state.staffMembers.filter(x=>x.id!==m.id);audit('حذف منسوبة',`${m.name} • ${m.role}`);save();closeModal();toast('تم حذف المنسوبة');render();});
}
function openGroupsManager(){const st=schoolGroupStats();const byGrade=Object.entries(st.byGrade).map(([g,n])=>`<span class="badge blue">${esc(g)}: ${n}</span>`).join(' ');const rows=st.items.map(x=>`<tr><td>${esc(x.grade)}</td><td>${esc(x.section)}</td><td>${x.count}</td></tr>`).join('');openModal(`<div class="modal-header"><div><h3>الصفوف والشعب</h3><p class="muted">الحساب الصحيح يعتمد على تركيبة الصف + رقم الشعبة، وليس رقم الشعبة وحده.</p></div><button class="btn icon secondary" id="closeGroups">✕</button></div><div class="modal-body"><div class="notice green"><strong>${st.total} شعبة فعلية</strong><br>${byGrade}</div><div class="table-wrap" style="margin-top:14px"><table><thead><tr><th>الصف</th><th>الشعبة</th><th>عدد الطالبات المسجلات</th></tr></thead><tbody>${rows}</tbody></table></div></div><div class="modal-footer"><button class="btn secondary" id="closeGroups2">إغلاق</button></div>`);document.getElementById('closeGroups').onclick=closeModal;document.getElementById('closeGroups2').onclick=closeModal;}
function openDataTransfer(){openModal(`<div class="modal-header"><h3>النسخ والاستيراد</h3><button class="btn icon secondary" id="closeTransfer">✕</button></div><div class="modal-body"><div class="quick-actions"><button class="quick-action" id="transferImport"><strong>استيراد بيانات</strong><span>قراءة ومعاينة قبل الاعتماد</span></button><button class="quick-action" id="transferBackup"><strong>حفظ نسخة احتياطية</strong><span>جميع بيانات المدرسة بصيغة JSON</span></button><button class="quick-action" id="transferRestore"><strong>استعادة نسخة احتياطية</strong><span>اختيار ملف JSON ثم معاينته قبل الاستعادة</span></button><button class="quick-action" id="transferExport"><strong>تصدير الطالبات</strong><span>CSV للأسماء والصفوف والشعب والتواصل</span></button><button class="quick-action danger-action" id="transferDelete"><strong>حذف بيانات</strong><span>نطاق محدد + عدد السجلات + تأكيد</span></button></div></div><div class="modal-footer"><button class="btn secondary" id="closeTransfer2">إغلاق</button></div>`);document.getElementById('closeTransfer').onclick=closeModal;document.getElementById('closeTransfer2').onclick=closeModal;document.getElementById('transferImport').onclick=()=>openImportModal();document.getElementById('transferRestore').onclick=()=>openImportModal('backup');document.getElementById('transferBackup').onclick=()=>{downloadBackup();};document.getElementById('transferExport').onclick=()=>exportStudentsCsv();document.getElementById('transferDelete').onclick=()=>openDeleteDataModal();}
function updateSupportStatus(id,status){const t=(state.supportTickets||[]).find(x=>x.id===id);if(!t)return;t.status=status;audit('تحديث حالة طلب دعم',`${id} ← ${status}`);save();toast('تم تحديث حالة طلب الدعم');render();}
function submitSupportTicket(){
  const desc=document.getElementById('supportDescription').value.trim();if(!desc){toast('اكتبي وصف المشكلة');return;}const now=new Date();const t={id:`SUP-${String((state.supportTickets||[]).length+1).padStart(4,'0')}`,schoolId:state.school.id,category:document.getElementById('supportCategory').value,priority:document.getElementById('supportPriority').value,description:desc,contact:document.getElementById('supportContact').value.trim(),status:'جديد',by:ROLES[state.role],date:now.toISOString().slice(0,10),time:now.toTimeString().slice(0,5)};state.supportTickets=state.supportTickets||[];state.supportTickets.push(t);audit('فتح طلب دعم فني',`${t.id} • ${t.category} • ${t.priority}`);toast(`تم حفظ طلب الدعم ${t.id}`);render();
}

function runSelfTests(){
  const results=[];const ok=(name,pass,note='')=>results.push({name,pass:!!pass,note});
  const gs=schoolGroupStats();ok('عدد الطالبات من الملف',state.students.length===700,`الموجود ${state.students.length}`);ok('حساب الشعب الفعلية',gs.total===22,`الموجود ${gs.total}`);ok('توزيع الشعب حسب الصف',gs.byGrade['الأول الثانوي']===5&&gs.byGrade['الثاني الثانوي']===7&&gs.byGrade['الثالث الثانوي']===10,JSON.stringify(gs.byGrade));ok('اكتمال أرقام أولياء الأمور',state.students.every(x=>!!x.guardianPhone));ok('عزل المدرسة في مفتاح التخزين',SCHOOL_STORAGE_KEY.includes(ACTIVE_SCHOOL_ID),SCHOOL_STORAGE_KEY);
  const origRole=state.role;for(const [r,cfg] of Object.entries(ROLE_UI)){state.role=r;ok(`صلاحيات ${ROLES[r]}`,cfg.pages.every(p=>canPage(p)));}state.role=origRole;
  const tempGate={gateTime:'07:05',classTime:'07:22'};const diff=minutesDiff(tempGate.gateTime,tempGate.classTime);ok('محاكاة البوابة→الفصل',diff===17&&diff>=state.settings.insideDelay,`الفرق ${diff} دقيقة`);
  const tempCase={status:'إجراء'};tempCase.status='متابعة';tempCase.status='مغلق';ok('محاكاة مسار الحالة',tempCase.status==='مغلق','رصد → إجراء → متابعة → إغلاق');
  const b=JSON.parse(JSON.stringify(state));const restored=JSON.parse(JSON.stringify(b));ok('محاكاة النسخ/الاستعادة',restored.students.length===state.students.length&&restored.school.id===state.school.id);
  ok('حساب أثر الحذف قبل التنفيذ',deletionImpact('students')===state.students.length,`${deletionImpact('students')} سجل`);
  const sample=state.students.slice(0,2).map(x=>({...x}));const rev=reviewImportStudents(sample);ok('معاينة الاستيراد قبل الاعتماد',rev.updated===2&&rev.total===2,JSON.stringify(rev));
  ok('لا إرسال تلقائي لولي الأمر',typeof openGuardianContact==='function','التواصل يحتاج إجراء من المستخدمة');
  const html=`<div class="card"><h2>نتيجة الاختبار الداخلي</h2><p>محاكاة لا تغيّر البيانات ولا تحفظ حالات اختبار.</p>${results.map(r=>`<div class="notice ${r.pass?'green':'warning'}"><strong>${r.pass?'✓':'✗'} ${esc(r.name)}</strong>${r.note?`<br>${esc(r.note)}`:''}</div>`).join('')}</div>`;document.getElementById('content').innerHTML=html;setHeader('اختبار المسارات','محاكاة داخلية دون إضافة بيانات جديدة');return results;
}
function openGapModal(){openModal(`<div class="modal-header"><h3>بطاقة فجوة جديدة</h3><button class="btn icon secondary" id="closeGap">✕</button></div><div class="modal-body"><div class="form-grid"><div class="field"><label>الفجوة</label><input value="التأخر الصباحي"></div><div class="field"><label>خط الأساس</label><input type="number" value="184"></div><div class="field"><label>المستهدف %</label><input type="number" value="40"></div><div class="field"><label>الفترة</label><input value="4 أسابيع"></div><div class="field full"><label>أسباب مرصودة/محتملة</label><textarea rows="3" placeholder="لا يعتبر السبب حقيقة حتى يعتمد من الفريق"></textarea></div><div class="field full"><label>تدخل مقترح</label><textarea rows="3" value="برنامج الانضباط الصباحي">برنامج الانضباط الصباحي + تواصل أسري للحالات المتكررة + تعزيز الفصول الأعلى انضباطًا</textarea></div></div></div><div class="modal-footer"><button class="btn purple" id="saveGap">حفظ كمسودة</button></div>`);document.getElementById('closeGap').onclick=closeModal;document.getElementById('saveGap').onclick=()=>{closeModal();toast('تم حفظ بطاقة الفجوة كمسودة');};}

init();
if(new URLSearchParams(location.search).get('selftest')==='1')runSelfTests();

</script>
